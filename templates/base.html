{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link rel="stylesheet" href="{% static 'pure/pure-min.css' %}" />
        <link rel="stylesheet" href="{% static 'pure/grids-responsive-min.css' %}" />
        <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}" />
        <link rel="stylesheet" href="{% static 'css/main.css' %}" />
        <script src="{% static 'htmx/htmx.min.js' %}"></script>
        <script src="{% static 'html5-qrcode/html5-qrcode.min.js' %}"></script>
        <title>{% block wholetitle %} {% block title %} {% endblock title %} - Pethau{% endblock wholetitle %}</title>
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <div id="layout">
            <div class="top-menu pure-menu">
                <a
                    href="#menu"
                    id="menuLink"
                    class="menu-link pure-menu-item"
                    hx-on:click="document.getElementById('layout').classList.toggle('active'); event.preventDefault()"
                >
                    <i class="fas fa-bars"></i>
                </a>
                <a
                    href="/assets/"
                    class="pure-menu-item {% if request.resolver_match.url_name|slice:':5' == 'asset' %}pure-menu-selected{% endif %}"
                >
                    <i class="fas fa-boxes-stacked"></i>
                </a>
                <a
                    href="/models/"
                    class="pure-menu-item {% if request.resolver_match.url_name|slice:':5' == 'model' %}pure-menu-selected{% endif %}"
                >
                    <i class="fas fa-border-top-left"></i>
                </a>
                <a
                    href="/bulk-audit/"
                    class="pure-menu-item {% if request.resolver_match.url_name|slice:':10' == 'bulk-audit' %}pure-menu-selected{% endif %}"
                >
                    <i class="fas fa-boxes-packing"></i>
                </a>
            </div>

            <div id="menu">
                <div class="pure-menu">
                    <a class="pure-menu-heading" href="/">Pethau</a>

                    <ul class="pure-menu-list">
                        <li class="pure-menu-item">
                            <a
                                href="/assets/"
                                class="pure-menu-link {% if request.resolver_match.url_name|slice:':5' == 'asset' %}pure-menu-selected{% endif %}"
                                ><i class="fa-solid fa-boxes-stacked fa-width-fixed"></i> Assets</a
                            >
                        </li>
                        <li class="pure-menu-item">
                            <a
                                href="/models/"
                                class="pure-menu-link {% if request.resolver_match.url_name|slice:':5' == 'model' %}pure-menu-selected{% endif %}"
                                ><i class="fa-solid fa-border-top-left fa-width-fixed"></i> Models</a
                            >
                        </li>
                        <li class="pure-menu-item">
                            <a
                                href="/bulk-audit/"
                                class="pure-menu-link {% if request.resolver_match.url_name|slice:':10' == 'bulk-audit' %}pure-menu-selected{% endif %}"
                                ><i class="fa-solid fa-boxes-packing fa-width-fixed"></i> Bulk Audit</a
                            >
                        </li>
                        <li class="pure-menu-item">
                            <a href="/admin" class="pure-menu-link"
                                ><i class="fa-solid fa-cog fa-width-fixed"></i> Admin</a
                            >
                        </li>
                    </ul>
                </div>
            </div>

            <div id="main" hx-on:click="document.getElementById('layout').classList.remove('active')">
                <div class="content">{% block content %} {% endblock content %}</div>
            </div>
        </div>
        <script>
            // Data-entry forms shouldn't submit when Enter
            // is pressed in one of their fields.
            document.addEventListener("keydown", function (e) {
                if (e.key !== "Enter") return;
                if (e.target.tagName !== "INPUT") return;
                if (e.target.closest(".pure-form-aligned")) {
                    e.preventDefault();
                }
            });
        </script>
        <script src="{% static 'js/combo.js' %}"></script>
        <script src="{% static 'js/scanner.js' %}"></script>
    </body>
</html>
