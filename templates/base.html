{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
            integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
        <link rel="stylesheet" href="{% static 'css/main.css' %}" />
        <title>{% block wholetitle %} {% block title %} {% endblock title %} - Pethau{% endblock wholetitle %}</title>
    </head>
    <body>
        <div id="layout">
            <a href="#menu" id="menuLink" class="menu-link">
                <!-- Hamburger icon -->
                <span></span>
            </a>

            <div id="menu">
                <div class="pure-menu">
                    <a class="pure-menu-heading" href="#company">Pethau</a>

                    <ul class="pure-menu-list">
                        <li class="pure-menu-item">
                            <a href="/assets/" class="pure-menu-link pure-menu-selected"
                                ><i class="fa-solid fa-boxes-stacked fa-width-fixed"></i> Assets</a
                            >
                        </li>
                        <li class="pure-menu-item">
                            <a href="#about" class="pure-menu-link"
                                ><i class="fa-solid fa-border-top-left fa-width-fixed"></i> Models</a
                            >
                        </li>
                        <li class="pure-menu-item">
                            <a href="/admin" class="pure-menu-link"
                                ><i class="fa-solid fa-cog fa-width-fixed"></i> Admin</a
                            >
                        </li>
                    </ul>
                </div>
            </div>

            <div id="main">
                <div class="content">{% block content %} {% endblock content %}</div>
            </div>
        </div>
        <script>
            (function (window, document) {
                // we fetch the elements each time because docusaurus removes the previous
                // element references on page navigation
                function getElements() {
                    return {
                        layout: document.getElementById("layout"),
                        menu: document.getElementById("menu"),
                        menuLink: document.getElementById("menuLink"),
                    };
                }

                function toggleClass(element, className) {
                    var classes = element.className.split(/\s+/);
                    var length = classes.length;
                    var i = 0;

                    for (; i < length; i++) {
                        if (classes[i] === className) {
                            classes.splice(i, 1);
                            break;
                        }
                    }
                    // The className is not found
                    if (length === classes.length) {
                        classes.push(className);
                    }

                    element.className = classes.join(" ");
                }

                function toggleAll() {
                    var active = "active";
                    var elements = getElements();

                    toggleClass(elements.layout, active);
                    toggleClass(elements.menu, active);
                    toggleClass(elements.menuLink, active);
                }

                function handleEvent(e) {
                    var elements = getElements();

                    if (e.target.id === elements.menuLink.id) {
                        toggleAll();
                        e.preventDefault();
                    } else if (elements.menu.className.indexOf("active") !== -1) {
                        toggleAll();
                    }
                }

                document.addEventListener("click", handleEvent);
            })(this, this.document);
        </script>
    </body>
</html>
