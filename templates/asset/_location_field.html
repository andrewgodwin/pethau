<div class="pure-control-group field-location">
    <label for="{{ field.id_for_label }}">{{ label|default:"Location" }}</label>
    <div class="combo-row">
        <div class="combo">
            <input
                type="text"
                class="combo-search location-search"
                name="q"
                autocomplete="off"
                placeholder="Search assets…"
                value="{{ current_value|default:'' }}"
                hx-get="{% url 'asset-search' %}?exclude={{ exclude_pk }}"
                hx-trigger="input changed delay:200ms, focus"
                hx-target="next .combo-options"
                hx-swap="innerHTML"
                hx-params="q"
            />
            {{ field }}
            <div class="combo-options"></div>
        </div>
        {% if scan_placeholder %}
        <button type="button" class="placeholder-icon" disabled title="Barcode scanning coming soon">
            <i class="fas fa-barcode"></i>
        </button>
        {% endif %}
    </div>
    {% for error in field.errors %}
    <span class="error">{{ error }}</span>
    {% endfor %}
</div>
