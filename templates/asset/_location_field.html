<div class="pure-control-group field-location">
    <label class="pure-u-1 pure-u-md-1-5" for="{{ field.id_for_label }}">{{ label|default:"Location" }}</label>
    <div class="pure-u-1 pure-u-md-3-4">
        <div class="combo-row">
            <div class="combo">
                <input
                    type="text"
                    id="{{ field.id_for_label }}-search"
                    class="combo-search location-search"
                    name="q"
                    autocomplete="off"
                    placeholder="Search assets…"
                    value="{{ current_value.tag|default:'' }}"
                    hx-get="{% url 'asset-search' %}?exclude={{ exclude_pk }}"
                    hx-trigger="input changed delay:200ms, focus"
                    hx-target="next .combo-options"
                    hx-swap="innerHTML"
                    hx-params="q"
                />
                <span class="combo-selected-name">{{ current_value.name|default:'' }}</span>
                {{ field }}
                <div class="combo-options"></div>
            </div>
            {% if scan_placeholder %}
            {% include "_barcode_scanner.html" with target=field.id_for_label|add:"-search" %}
            {% endif %}
        </div>
        {% for error in field.errors %}
        <span class="error">{{ error }}</span>
        {% endfor %}
    </div>
</div>
