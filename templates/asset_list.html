{% extends "base.html" %}

{% block content %}
<div class="actions">
    <input type="text" placeholder="Search..." />
    <button class="search-btn" type="button" aria-label="Search"><i class="fas fa-search"></i></button>
    <span class="spacer"></span>
    <a href="#"><i class="fas fa-refresh"></i></a>
    <a class="main" href="{% url 'asset-create' %}">New</a>
</div>

<div class="asset-list">
    {% for asset in assets %}
    <div class="asset-item">
        <a href="">{{ asset.name }} {{ asset.tag }}</a>
    </div>
    {% endfor %}
</div>

{% endblock content %}
