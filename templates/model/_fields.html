{% if form.non_field_errors %}
<ul class="errorlist">
    {% for error in form.non_field_errors %}
    <li>{{ error }}</li>
    {% endfor %}
</ul>
{% endif %}
<fieldset>
    {% include "_field.html" with field=form.name %}
    {% include "_field.html" with field=form.manufacturer %}
    {% include "_field.html" with field=form.short_name %}
</fieldset>
