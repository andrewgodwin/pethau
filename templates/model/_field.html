<div class="pure-control-group field-model required">
    <label for="id_model">Model</label>
    <div class="model-combo">
        <input
            type="text"
            id="model-search"
            name="q"
            class="model-search-input"
            autocomplete="off"
            placeholder="Search models…"
            value="{{ form.instance.model|default_if_none:'' }}"
            hx-get="{% url 'model-search' %}"
            hx-trigger="input changed delay:200ms, focus"
            hx-target="#model-options"
            hx-swap="innerHTML"
            hx-params="q"
        />
        {{ form.model }}
        <div id="model-options" class="model-options"></div>
        <button
            type="button"
            class="model-add-btn"
            title="Add new model"
            hx-get="{% url 'model-quick-create' %}"
            hx-target="#model-modal-body"
            hx-swap="innerHTML"
            hx-on::after-request="document.getElementById('model-modal').showModal()"
        >
            <i class="fas fa-plus"></i>
        </button>
    </div>
    {% for error in form.model.errors %}
    <span class="error">{{ error }}</span>
    {% endfor %}
</div>
<script>
    (function () {
        var options = document.getElementById("model-options");
        var search = document.getElementById("model-search");
        var hidden = document.getElementById("id_model");

        function items() {
            return options.querySelectorAll(".model-option[data-id]");
        }

        function highlighted() {
            return options.querySelector(".model-option.active");
        }

        function highlight(opt) {
            var current = highlighted();
            if (current) current.classList.remove("active");
            if (opt) {
                opt.classList.add("active");
                opt.scrollIntoView({ block: "nearest" });
            }
        }

        function selectOption(opt) {
            if (!opt || !opt.dataset.id) return;
            hidden.value = opt.dataset.id;
            search.value = opt.dataset.name;
            options.innerHTML = "";
        }

        search.addEventListener("input", function () {
            // Require an explicit pick from the dropdown rather than
            // silently keeping whatever model was previously selected.
            hidden.value = "";
        });

        search.addEventListener("keydown", function (e) {
            var list = items();
            if (!list.length) return;
            var current = highlighted();
            var index = current ? Array.prototype.indexOf.call(list, current) : -1;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                highlight(list[Math.min(index + 1, list.length - 1)]);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                highlight(list[Math.max(index - 1, 0)]);
            } else if (e.key === "Enter") {
                e.preventDefault();
                selectOption(current || list[0]);
            }
        });

        options.addEventListener("click", function (e) {
            selectOption(e.target.closest(".model-option"));
        });

        document.addEventListener("click", function (e) {
            if (!e.target.closest(".model-combo")) {
                options.innerHTML = "";
            }
        });
    })();
</script>
