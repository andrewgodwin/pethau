<div class="pure-control-group field-model required">
    <label for="id_model">Model</label>
    <div class="combo model-combo">
        <input
            type="text"
            id="model-search"
            class="combo-search"
            name="q"
            autocomplete="off"
            placeholder="Search models…"
            value="{{ form.instance.model|default_if_none:'' }}"
            hx-get="{% url 'model-search' %}"
            hx-trigger="input changed delay:200ms, focus"
            hx-target="next .combo-options"
            hx-swap="innerHTML"
            hx-params="q"
        />
        {{ form.model }}
        <div class="combo-options"></div>
        <button
            type="button"
            class="icon-btn model-add-btn"
            title="Add new model"
            hx-get="{% url 'model-quick-create' %}"
            hx-target="#model-modal-body"
            hx-swap="innerHTML"
            hx-on::after-request="document.getElementById('model-modal').showModal()"
        >
            <i class="fas fa-plus"></i>
        </button>
    </div>
    {% for error in form.model.errors %}
    <span class="error">{{ error }}</span>
    {% endfor %}
</div>
