[project]
name = "pethau"
version = "0.1.0"
description = "An asset manager"
readme = "README.md"
authors = [
    { name = "Andrew Godwin", email = "andrew@aeracode.org" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-imagekit>=6.1.0",
    "pre-commit>=4.6.1",
    "urlman>=2.0.3",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = [
    "E203",
    "E266",
    "E402",
    "F405",
    "E501",
    "E731",
    # Mutable class defaults are the standard Django idiom (e.g. list_display)
    "RUF012",
]

[tool.docformatter]
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
wrap-summaries = 88
wrap-descriptions = 88
